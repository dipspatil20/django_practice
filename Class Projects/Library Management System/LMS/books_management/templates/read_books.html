{% extends "main.html" %}

{% block content %}

    <h1>details of books</h1>
    <table border="2">
        {% for i in context %}

        <tr>
            <th>BOOK</th>
            <td> {{ i.bname }}</td>
        </tr>
        <tr>
            <th>AUTHOR</th>
            <td>{{ i.author }}</td>
        </tr>
        <tr>
            <th>GENRE</th>
            <td>{{ i.genre }}</td>
        </tr>
        <tr>
            <th>AVAILABLE</th>
            <td>{{ i.avail }}</td>
        </tr>
        <tr>
            <a href="{% url 'update_b' i.id %}"><button>UPDATE</button></a>
        </tr>
        <tr>
            <a href="{% url 'delete_b' i.id %}"><button>DELETE</button></a>
        </tr>

        {% endfor %}
    </table>
    <a href="{% url 'create_b' %}"><button type="button">ADD BOOKS</button></a>


{% endblock  %}

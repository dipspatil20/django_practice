{% extends "main.html" %}

{% block content %}

    <center>
        <h1>Employee Data</h1>
        {% for obj in context %}
            Empname : {{obj.empname}}<br>
            Empsal : {{obj.empsal}} <br>
            Department : {{obj.dept}} <br>
            Location : {{obj.loc}} <br>
            Available? : {{obj.avail}} <br>
            <button type="button"><a href="{% url 'update' obj.id %}">UPDATE</a></button>
            <button type="button"><a href="{% url 'delete' obj.id %}">DELETE</a></button>
        {% endfor %}
        
    </center>

{% endblock  %}

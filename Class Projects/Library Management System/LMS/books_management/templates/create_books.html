{% extends "main.html" %}

{% block content %}

    <h1>Add the books into the library..</h1>

    <table border="2">
        <form method="post">
            {% csrf_token %}

            <tr>
                <th>Book Name</th>
                <td><input type="text" name="bname" required></td>
            </tr>
            <tr>
                <th>Author Name</th>
                <td><input type="text" name="author" required></td>
            </tr>
            <tr>
                <th>Genre</th>
                <td><input type="text" name="genre" required></td>
            </tr>
            <tr>
                <th>Available</th>
                <td><input type="radio" name="avail" value="True">YES
                <input type="radio" name="avail" value="False">NO</td>
            </tr>
            <tr>
                <td><button type="submit">SUBMIT</button></td>
                <td><button type="reset">CLEAR</button></td>
            </tr>

        </form>
    </table>

{% endblock  %}
